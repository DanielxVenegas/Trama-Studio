<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><title>Personaliza tu playera | Trama Studio</title><link rel="stylesheet" href="css/personalizar.css"></head>
<body data-page="custom"><div id="site-header"></div><main class="wrap layout">
<div class="preview stitch"><div id="preview"></div><p id="preview-note">Elige corte y color. Tu diseño aparecerá aquí.</p></div>
<form id="form" novalidate><h1 style="font-size:clamp(2rem,5vw,3rem)">Personaliza tu playera</h1>
<fieldset><legend>1. Sube tu diseño</legend><label class="drop"><input type="file" id="file" accept="image/*"><strong>Elige una imagen</strong><small>PNG, JPG o SVG, máximo 8 MB</small></label></fieldset>
<fieldset><legend>2. Elige el corte</legend><div class="cut-list" id="cuts"></div></fieldset>
<fieldset><legend>3. Elige el color</legend><div class="swatches" id="swatches"></div></fieldset>
<fieldset><legend>4. Tus datos</legend><div class="fields">
<div><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" required autocomplete="name"></div>
<div><label for="talla">Talla</label><select id="talla" name="talla"><option>S</option><option selected>M</option><option>L</option><option>XL</option></select></div>
<div><label for="cant">Cantidad</label><input type="number" id="cant" name="cant" min="1" value="1" required></div></div>
<label for="notas">Notas (opcional)</label><textarea id="notas" name="notas" rows="3" placeholder="Posición del diseño, tamaño, estampado en espalda..."></textarea></fieldset>
<div class="status" id="status" role="status"></div>
<div class="actions"><button type="button" class="btn btn-ghost" id="to3d">Ver en 3D</button><button type="submit" class="btn btn-primary">Enviar pedido por WhatsApp</button></div>
</form></main><div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/components.js"></script><script src="js/personalizar.js"></script></body></html>
