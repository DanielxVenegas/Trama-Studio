<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/cart.css"><title>Visor 3D | Trama Studio</title><link rel="stylesheet" href="css/visor.css"></head>
<body data-page="viewer"><div id="site-header"></div><main class="wrap viewer">
<div class="stage stitch" id="stage" aria-label="Playera en 3D. Arrastra para girar, usa la rueda para acercar."><p class="hint">Arrastra para girar. Rueda o pellizca para acercar.</p></div>
<aside class="panel stitch"><h2>Tu playera en 3D</h2>
<div class="group"><span>Diseño</span><label class="drop-sm"><input type="file" id="file" accept="image/*">Subir mi diseño</label><div class="msg" id="msg" role="status"></div>
<div class="seg" id="sides" role="group" aria-label="Lado del diseño"><button type="button" data-side="front" aria-pressed="true">Al frente</button><button type="button" data-side="back" aria-pressed="false">En la espalda</button></div>
<label class="rng">Tamaño<input type="range" id="scale" min=".5" max="1.3" step=".05" value="1"></label>
<label class="rng">Altura<input type="range" id="dy" min="-.25" max=".1" step=".01" value="0"></label></div>
<div class="group"><span>Corte</span><div class="cuts" id="cuts"></div></div>
<div class="group"><span>Color</span><div class="swatches" id="swatches"></div></div>
<div class="group"><span>Vista</span><div class="seg" id="views" role="group" aria-label="Vista"><button type="button" data-view="0">Frente</button><button type="button" data-view="3.14159">Espalda</button><button type="button" data-view="1.5708">Lado</button><button type="button" id="spin" aria-pressed="true">Giro automático</button></div></div>
<div class="group"><span>Fondo</span><div class="swatches" id="bgs"><button type="button" class="swatch" data-bg="claro" style="--c:#E3E8F2" aria-label="Claro" aria-pressed="true"></button><button type="button" class="swatch" data-bg="oscuro" style="--c:#16203d" aria-label="Oscuro" aria-pressed="false"></button><button type="button" class="swatch" data-bg="sol" style="--c:#FFD23F" aria-label="Amarillo" aria-pressed="false"></button></div></div>
<button type="button" class="btn btn-sun" id="real" hidden>Ver foto realista</button>
<button type="button" class="btn btn-ghost" id="shot">Descargar imagen</button>
<a class="btn btn-primary order-link" id="order" href="personalizar.html">Terminar pedido</a></aside>
</main>
<dialog id="real-dlg" class="stitch"><img id="real-img" alt="Foto realista de tu playera"><div class="dlg-actions"><a class="btn btn-primary" id="real-dl" target="_blank" rel="noopener">Abrir imagen</a><button type="button" class="btn btn-ghost" id="real-x">Cerrar</button></div></dialog><div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script><script src="js/components.js"></script><script src="js/cart.js"></script><script src="js/shirt-model.js"></script><script src="js/visor.js"></script><script src="js/mockup-api.js"></script></body></html>
